<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#14235E"/>
    </linearGradient>
    <linearGradient id="crossLight" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F1E8"/>
      <stop offset="1" stop-color="#D9D4C3"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C81E3A"/>
      <stop offset="1" stop-color="#8F1327"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- lattice frame lines (stained glass leading) -->
  <g stroke="#0B1440" stroke-width="6" opacity="0.55" fill="none">
    <line x1="0" y1="171" x2="512" y2="171"/>
    <line x1="0" y1="341" x2="512" y2="341"/>
    <line x1="171" y1="0" x2="171" y2="512"/>
    <line x1="341" y1="0" x2="341" y2="512"/>
    <line x1="0" y1="0" x2="512" y2="512"/>
    <line x1="512" y1="0" x2="0" y2="512"/>
  </g>

  <!-- corner facets, alternating tone for lattice glass feel -->
  <g opacity="0.18" fill="#F4F1E8">
    <polygon points="0,0 171,0 0,171"/>
    <polygon points="512,0 341,0 512,171"/>
    <polygon points="0,512 171,512 0,341"/>
    <polygon points="512,512 341,512 512,341"/>
  </g>

  <!-- cross, built from faceted panels -->
  <g>
    <!-- vertical beam -->
    <polygon points="211,70 301,70 301,442 211,442" fill="url(#crossLight)"/>
    <!-- horizontal beam -->
    <polygon points="90,191 422,191 422,281 90,281" fill="url(#crossLight)"/>
    <!-- sacrifice red accent facet at the crossing -->
    <polygon points="211,191 301,191 301,281 211,281" fill="url(#red)"/>
    <!-- leading around the cross -->
    <g stroke="#0B1440" stroke-width="7" fill="none" opacity="0.7">
      <polygon points="211,70 301,70 301,442 211,442"/>
      <polygon points="90,191 422,191 422,281 90,281"/>
    </g>
  </g>
</svg>
